<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Send only the origin as Referer: the CDSE WAF rejects requests whose
         Referer contains a URL in a query parameter, which the OIDC login
         callback does (iss=https%3A%2F%2Fidentity.dataspace.copernicus.eu...),
         blocking all asset loads on /auth and thereby the whole login flow. -->
    <meta name="referrer" content="strict-origin">
    <meta name="description" id="meta-description" content="">
    <meta name="og:type" content="website">
    <meta name="og:url" id="og-url" content="<%- catalogUrl %>">
    <meta property="og:title" id="og-title" content="<%- catalogTitle %>"/>
    <meta name="og:description" id="og-description" content="">
    <meta name="og:locale" id="og-locale" content="en">
    <meta name="og:site_name" content="<%- catalogTitle %>">
    <% if (RUNTIME) { %>
    <base href="<%- pathPrefix %>" id="stac-browser-base">
    <script defer src="./runtime-config.js"></script>
    <% } %>
    <title><%- catalogTitle %></title>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but STAC Browser doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <% if (RUNTIME) { %>
    <link rel="stylesheet" href="./runtime-style.css">
    <% } %>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
